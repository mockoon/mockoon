name: Release web app

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - web-v*

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{secrets.FIREBASE_TOKEN}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install firebase
        run: npm install -g firebase-tools
      - name: Extract web app version
        id: web-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/web-v* ]]; then
            WEB_VERSION=${GITHUB_REF#refs/tags/web-v}
          else
            WEB_VERSION=$(node -p -e "require('./packages/app/package.json').version")
          fi

          echo "WEB_VERSION=$WEB_VERSION" >> $GITHUB_OUTPUT
      - name: Build application
        run: |
          npm ci
          npm run build:libs
          npm run build:web:prod
      - name: Upload web app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app-dist-v${{steps.web-version.outputs.WEB_VERSION}}
          path: packages/app/dist/renderer/
      - name: deploy
        run: |
          npm run deploy:web
