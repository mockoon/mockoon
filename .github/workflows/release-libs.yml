name: Release libs (NPM)

permissions:
  contents: read

on:
  push:
    tags:
      - libs-v*
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to copy to AWS Public ECR (e.g. 9.10.0). Defaults to packages/cli/package.json version."
        required: false
        type: string

jobs:
  npm-publish:
    name: Publish the libs on NPM
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' }}
    permissions:
      id-token: write # Required for NPM Trusted Publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: |
          npm run build:libs
          npm run build:serverless
          npm run build:cli
      - name: Extract libs version from tag
        id: libs-version
        run: |
          LIBS_VERSION=${GITHUB_REF#refs/tags/libs-v}
          echo "LIBS_VERSION=$LIBS_VERSION" >> $GITHUB_OUTPUT
      - name: Generate SPDX SBOM files
        run: |
          mkdir -p sbom-files
          for pkg in commons commons-server cloud serverless cli; do
            cd packages/$pkg
            npm sbom --sbom-type library --sbom-format spdx --omit dev > ../../sbom-files/mockoon-$pkg-v${{steps.libs-version.outputs.LIBS_VERSION}}-sbom.spdx.json
            cd - > /dev/null
          done
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libs-sbom-files-v${{steps.libs-version.outputs.LIBS_VERSION}}
          path: sbom-files/
      - name: NPM publish
        run: |
          npm run publish

  cli-docker:
    name: Push Docker image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    needs: npm-publish
    if: ${{ github.event_name == 'push' && success() }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract app version
        id: app-version
        run: |
          PACKAGE_VERSION=$(node -p -e "require('./packages/cli/package.json').version")
          PACKAGE_MAJOR_VERSION=$(node -p -e "require('./packages/cli/package.json').version.split('.')[0]")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "PACKAGE_MAJOR_VERSION=$PACKAGE_MAJOR_VERSION" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: "arm64,arm,x86_64"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: ./packages/cli/docker
          tags: |
            mockoon/cli:latest
            mockoon/cli:${{steps.app-version.outputs.PACKAGE_VERSION}}
            mockoon/cli:${{steps.app-version.outputs.PACKAGE_MAJOR_VERSION}}
          build-args: |
            version=${{steps.app-version.outputs.PACKAGE_VERSION}}

  cli-docker-ecr:
    name: Copy Docker image to AWS Public ECR
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC authentication

    needs: cli-docker
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.cli-docker.result == 'success') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract app version
        id: app-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            PACKAGE_VERSION="${INPUT_VERSION#libs-v}"
            PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          else
            PACKAGE_VERSION=$(node -p -e "require('./packages/cli/package.json').version")
          fi
          PACKAGE_MAJOR_VERSION="${PACKAGE_VERSION%%.*}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_MAJOR_VERSION=$PACKAGE_MAJOR_VERSION" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1
      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        with:
          registry-type: public
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Copy Docker image to AWS Public ECR
        env:
          PACKAGE_VERSION: ${{ steps.app-version.outputs.PACKAGE_VERSION }}
          PACKAGE_MAJOR_VERSION: ${{ steps.app-version.outputs.PACKAGE_MAJOR_VERSION }}
        run: |
          SOURCE_IMAGE="docker.io/mockoon/cli:${PACKAGE_VERSION}"
          # Replace 'mockoon' with your AWS Public ECR registry alias if different
          TARGET_IMAGE="public.ecr.aws/z7j6m9o3/cli"

          crane copy "$SOURCE_IMAGE" "${TARGET_IMAGE}:${PACKAGE_VERSION}"
          crane tag "${TARGET_IMAGE}:${PACKAGE_VERSION}" "${PACKAGE_MAJOR_VERSION}"
          crane tag "${TARGET_IMAGE}:${PACKAGE_VERSION}" "latest"
