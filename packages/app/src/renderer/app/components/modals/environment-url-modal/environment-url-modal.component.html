<div class="modal-header">
  <h4 class="modal-title">
    New local environment from URL
    <br />
    <small class="text-muted h6">
      Load a Mockoon environment JSON file published at a URL. It can be
      refreshed later from the environment menu.
    </small>
  </h4>
</div>
<div class="modal-body">
  <label for="environmentUrl" class="form-label">URL</label>
  <input
    type="text"
    id="environmentUrl"
    class="form-control"
    placeholder="https://example.com/environment.json"
    [formControl]="url"
    (keydown.enter)="submit()"
  />
</div>
<div class="modal-footer">
  <button
    type="button"
    id="importEnvironmentUrl"
    class="btn btn-primary me-2"
    (click)="submit()"
    [disabled]="url.invalid"
  >
    Import
  </button>
  <button type="button" class="btn btn-secondary modal-close" (click)="close()">
    Cancel
  </button>
</div>
